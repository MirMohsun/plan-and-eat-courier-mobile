<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="roundedRect">
      <rect width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="#E8313B"/>

  <!-- Subtle noise/texture overlay -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="#C0191F" fill-opacity="0.25"/>

  <!-- Content group -->
  <g clip-path="url(#roundedRect)">

    <!-- "plan&" line -->
    <text
      x="512"
      y="338"
      text-anchor="middle"
      font-family="Arial Black, Arial, Helvetica, sans-serif"
      font-size="148"
      font-weight="900"
      fill="#ffffff"
      fill-opacity="0.92"
      letter-spacing="-4"
    >plan&amp;</text>

    <!-- "eat" line – large, same as original -->
    <text
      x="512"
      y="530"
      text-anchor="middle"
      font-family="Arial Black, Arial, Helvetica, sans-serif"
      font-size="220"
      font-weight="900"
      fill="#ffffff"
      letter-spacing="-8"
    >eat</text>

    <!-- Thin divider -->
    <rect x="160" y="568" width="704" height="5" rx="3" fill="#ffffff" fill-opacity="0.35"/>

    <!-- Delivery scooter icon (simplified) -->
    <!-- Body of scooter -->
    <g transform="translate(340, 660) scale(0.82)">
      <!-- Rear wheel -->
      <circle cx="80" cy="210" r="62" fill="none" stroke="#ffffff" stroke-width="22" stroke-opacity="0.95"/>
      <circle cx="80" cy="210" r="18" fill="#ffffff" fill-opacity="0.95"/>

      <!-- Front wheel -->
      <circle cx="370" cy="210" r="62" fill="none" stroke="#ffffff" stroke-width="22" stroke-opacity="0.95"/>
      <circle cx="370" cy="210" r="18" fill="#ffffff" fill-opacity="0.95"/>

      <!-- Frame body -->
      <path d="M80,210 L160,80 L260,80 L320,150 L370,150" stroke="#ffffff" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95"/>
      <path d="M160,80 L200,210" stroke="#ffffff" stroke-width="24" fill="none" stroke-linecap="round" stroke-opacity="0.95"/>

      <!-- Handlebar -->
      <path d="M320,90 L380,60 M370,148 L370,60" stroke="#ffffff" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95"/>

      <!-- Delivery box on back -->
      <rect x="186" y="22" width="110" height="82" rx="10" fill="#ffffff" fill-opacity="0.95"/>
      <line x1="241" y1="22" x2="241" y2="104" stroke="#E8313B" stroke-width="4" stroke-opacity="0.5"/>
      <line x1="186" y1="63" x2="296" y2="63" stroke="#E8313B" stroke-width="4" stroke-opacity="0.5"/>
    </g>

    <!-- "delivery" word below scooter -->
    <text
      x="512"
      y="930"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="76"
      font-weight="700"
      fill="#ffffff"
      fill-opacity="0.88"
      letter-spacing="8"
    >delivery</text>

  </g>
</svg>
