  /api/customers/refresh/:
    post:
      operationId: refresh_token
      description: "\n    Refresh the access token using a valid refresh token.\n\n\
        \    This endpoint allows clients to obtain a new access token without requiring\
        \ the user to log in again.\n    The refresh token obtained during login should\
        \ be used to get a new access token when the current one expires.\n\n    ###\
        \ Request body:\n    - **refresh**: The refresh token obtained during login\
        \ or previous refresh.\n\n    ### Successful response:\n    - **access**:\
        \ A new access token that can be used for authenticated requests.\n    - **refresh**:\
        \ The same refresh token that was provided (echoed back).\n\n    ### Security\
        \ notes:\n    - Refresh tokens have a longer lifespan than access tokens.\n\
        \    - If the refresh token is expired or invalid, the user must log in again.\n\
        \    - Use HTTPS in production to protect tokens during transmission.\n\n\
        \    ### Error responses:\n    - **400 Validation Error**: Invalid or expired\
        \ refresh token.\n    "
      summary: Refresh Access Token
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshToken'
        required: true
      security:
      - tokenAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshToken'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/customers/register/:
    post:
      operationId: customer_register
      description: "\n    Register a new customer account.\n\n    This endpoint creates\
        \ a new inactive user account using the provided personal details and credentials.\n\
        \    After successful registration, a one-time password (OTP) is generated\
        \ and sent to the customer's email address\n    to verify and activate the\
        \ account.\n\n    ### Request body:\n    - **name**: Customer first name\n\
        \    - **surname**: Customer last name\n    - **email**: Unique email address\n\
        \    - **mobile**: Unique mobile number\n    - **password**: Account password\
        \ (minimum 8 characters)\n    - **password2**: Password confirmation (must\
        \ match password)\n\n    ### Successful response:\n    - Newly created user\
        \ information\n\n    ### Post-registration flow:\n    - Account is created\
        \ as inactive\n    - OTP is sent via email for verification\n    - User must\
        \ activate the account before login\n\n    ### Errors:\n    - Email already\
        \ exists\n    - Mobile already exists\n    - Password too short\n    - Passwords\
        \ do not match\n    "
      summary: Customer Register
