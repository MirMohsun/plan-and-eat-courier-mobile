        \ (list)\n        A JSON array of category objects.  Each object contains:\n\
        \        - id                  (int)\n        - address             (str)\
        \      — Full address of pick-up address\n        - longitude           (decimal)\
        \  — Longitude of pick-up address\n        - latitude            (decimal)\
        \  — Latitude of pick-up address\n        - min_active_sub      (int)    \
        \  — Min. active sub limit\n        - active_sub          (int)      — Current\
        \ count of active sub for each address\n    401 : ErrorResponseSerializer\n\
        \        Returned when the request lacks a valid authentication token.\n \
        \   "
