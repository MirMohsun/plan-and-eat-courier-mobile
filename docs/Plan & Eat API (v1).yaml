        \   (decimal)  — Latitude of pick-up address\n        - phone      (str) \
        \     — Phone number of pick-up address\n        - start_hour (time)     —\
        \ Start time of pick-up address\n        - end_hour   (time)     — End time\
        \ of pick-up address\n    401 : ErrorResponseSerializer\n        Returned\
        \ when the request lacks a valid authentication token.\n    "
