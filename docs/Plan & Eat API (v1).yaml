  /api/customers/verify/:
    post:
      operationId: verify_account
      description: "\n    Verify and activate a customer account using the OTP sent\
        \ via email.\n\n    After registration, the account is inactive. This endpoint\
        \ validates the One-Time Password (OTP)\n    sent to the customer's email.\
        \ If the OTP is correct, the account is activated and a login token is returned.\n\
        \n    ### Request body:\n    - **email**: The registered email address.\n\
        \    - **code**: The 6-digit OTP code received in the email.\n\n    ### Successful\
        \ response:\n    - Customer data\n    - **token**: Access and refresh tokens\
        \ for immediate login.\n\n    ### Error responses:\n    - **400 Validation\
        \ Error**: Invalid email, account does not exist, or incorrect OTP code.\n\
        \    "
      summary: Verify Customer Account
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAccount'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyAccount'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyAccount'
        required: true
