  /api/customers/resend-otp/:
    post:
      operationId: resend_otp
      description: "\n    Resend a new OTP code to verify an unactivated customer\
        \ account.\n\n    This endpoint is used when a customer did not receive the\
        \ original OTP or it has expired.\n    It generates a new OTP and sends it\
        \ to the registered email address.\n\n    ### Use cases:\n    - User did not\
        \ receive the original OTP email\n    - OTP code has expired (3 minutes validity)\n\
        \    - User accidentally deleted the email\n\n    ### Request body:\n    -\
        \ **email**: The registered email address that needs verification.\n\n   \
        \ ### Successful response:\n    - Returns basic customer information confirming\
        \ the OTP was resent.\n    - A new OTP is generated and sent to the email.\n\
        \n    ### Backend process:\n    1. Validates that the email exists in the\
        \ system.\n    2. Checks that the account is not already active (verified).\n\
        \    3. Generates a new OTP code using OTPHandler.\n    4. Sends the new OTP\
        \ via email.\n\n    ### Error responses:\n    - **400 Validation Error**:\n\
        \        - Email does not exist in the system\n        - Account is already\
        \ verified and active\n\n    ### Security notes:\n    - Each new OTP invalidates\
        \ the previous one.\n    - OTP codes expire after 3 minutes.\n    - Consider\
        \ rate limiting to prevent abuse.\n    - Only works for inactive (unverified)\
        \ accounts.\n    "
      summary: Resend OTP for Account Verification
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOTP'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendOTP'
        required: true
      security:
      - tokenAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOTP'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/customers/set-password/:
    post:
      operationId: set_password
