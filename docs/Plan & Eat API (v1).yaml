  /api/customers/logout/:
    post:
      operationId: logout
      description: "\n    Logout the customer by blacklisting the refresh token.\n\
        \n    This endpoint invalidates the user's session by adding their refresh\
        \ token to a blacklist,\n    preventing it from being used to generate new\
        \ access tokens. This is the secure way to log out\n    when using JWT authentication.\n\
        \n    ### Request body:\n    - **refresh**: The refresh token to be blacklisted.\n\
        \n    ### Authentication:\n    - Requires a valid access token in the Authorization\
        \ header.\n    - Format: `Authorization: Bearer <access_token>`\n\n    ###\
        \ Successful response:\n    - **200 OK**: The refresh token has been successfully\
        \ blacklisted.\n\n    ### Post-logout behavior:\n    - The blacklisted refresh\
        \ token can no longer be used to obtain new access tokens.\n    - The user\
        \ must log in again to obtain new tokens.\n    - The current access token\
        \ will remain valid until it naturally expires (cannot be revoked with JWT).\n\
        \n    ### Security best practices:\n    - Always call this endpoint when the\
        \ user logs out.\n    - Clear tokens from client-side storage (localStorage,\
        \ sessionStorage, cookies) after logout.\n    - Ensure `rest_framework_simplejwt.token_blacklist`\
        \ is in INSTALLED_APPS for this feature to work.\n\n    ### Error responses:\n\
        \    - **400 Validation Error**: Invalid or expired refresh token, or blacklist\
        \ not configured.\n    - **401 Unauthorized**: Access token is missing or\
        \ invalid.\n    "
      summary: Logout Customer
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
