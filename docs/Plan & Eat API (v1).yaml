  /api/meals/:
    get:
      operationId: meals
      description: "\n    OpenAPI schema decorator for the MealListView.\n\n    This\
        \ decorator documents the GET /meals/ endpoint which returns a\n    **paginated\
        \ and filterable** list of meal records, ordered by creation date\n    (ascending).\n\
        \n    Filtering\n    ---------\n    The view uses ``MealFilter`` (django-filter)\
        \ which allows the caller to\n    narrow the result set by query parameters\
        \ such as ``category``,\n    ``supplier``, ``ingredients``, and calorie-range\
        \ fields — see\n    ``apps/meals/filters.py`` for the exact filter fields.\n\
        \n    Pagination\n    ----------\n    ``CustomPageNumberPagination`` is applied;\
        \ use the ``page`` and\n    ``page_size`` query parameters to navigate through\
        \ results.\n\n    Tags\n    ----\n    MEALS\n\n    Responses\n    ---------\n\
        \    200 : MealReadSerializer (list, paginated)\n        A paginated JSON\
        \ object whose ``results`` array contains meal objects.\n        Each meal\
        \ object contains:\n        - id            (int)\n        - name        \
        \  (str)\n        - supplier      (object) — Nested SupplierReadSerializer\
        \ (id, name).\n        - category      (object) — Nested CategoryChildrenSerializer\
        \ (id, name, icon).\n        - ingredients   (list)   — List of IngredientReadSerializer\
        \ objects.\n        - meal_options (list) — List of MealOptionReadSerializer\
        \ objects.\n        - price         (decimal)\n        - image         (url)\
        \    — Presigned S3 URL for the meal image.\n        - calories      (decimal)\n\
        \        - proteins      (decimal)\n        - carbohydrates (decimal)\n  \
        \      - fats          (decimal)\n        - rating        (decimal)\n    \
        \    - created_at    (datetime)\n        - updated_at    (datetime)\n    401\
        \ : ErrorResponseSerializer\n        Returned when the request lacks a valid\
        \ authentication token.\n    "
      summary: Meal List
      parameters:
      - in: query
        name: carb_options
        schema:
          type: string
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: date
        schema:
          type: string
          format: date
      - in: query
        name: options
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: plan
        schema:
          type: string
      - in: query
        name: protein_options
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
      tags:
      - meals
      security:
      - tokenAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMealReadList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AuthenticationFailed:
                  value:
                    type: client_error
                    errors:
                    - code: authentication_failed
                      detail: Некорректные учетные данные.
                      attr: null
                NotAuthenticated:
                  value:
                    type: client_error
                    errors:
                    - code: not_authenticated
                      detail: Учетные данные не были предоставлены.
                      attr: null
          description: ''
  /api/meals/calories/:
    get:
      operationId: calories
      description: "\n    OpenAPI schema decorator for the CaloryListView.\n\n   \
        \ This decorator documents the GET /meals/calories/ endpoint which returns\n\
        \    the complete, ordered list of calorie-range records.  Each ``Calory``\n\
        \    record represents a named calorie band (e.g. \"Low\", \"Medium\", \"\
        High\")\n    defined by a ``start`` and ``end`` decimal value.  These ranges\
        \ are\n    typically displayed in the UI as filter chips on the meal search\
        \ screen.\n\n    Tags\n    ----\n    MEALS\n\n    Responses\n    ---------\n\
        \    200 : CaloryReadSerializer (list)\n        A JSON array of calory-range\
        \ objects.  Each object contains all model\n        fields **except** ``created_at``\
        \ and ``updated_at`` (excluded via\n        the serializer's ``Meta.exclude``),\
        \ specifically:\n        - id    (int)\n        - name  (str)     — Human-readable\
        \ range label (e.g. \"Low calorie\").\n        - start (decimal) — Lower bound\
        \ of the calorie range (kcal).\n        - end   (decimal) — Upper bound of\
        \ the calorie range (kcal).\n        - disabled (bool) — Disabled or not disabled\
        \ if there is any subscription plan\n    401 : ErrorResponseSerializer\n \
        \       Returned when the request lacks a valid authentication token.\n  \
        \  "
      summary: Calory Range List
      parameters:
      - in: query
        name: plan
        schema:
          type: integer
        description: The ID of the subscription plan to filter categories or check
          disabled status.
      tags:
      - meals
      security:
