        \    children via the ``CategoryChildrenSerializer`` nested under the\n  \
        \  ``children`` key.\n\n    Tags\n    ----\n    MEALS\n\n    Responses\n \
        \   ---------\n    200 : CategoryReadSerializer (list)\n        A JSON array\
        \ of category objects.  Each object contains:\n        - id       (int)\n\
        \        - name     (str)   — Human-readable category label.\n        - icon\
        \     (url)   — Presigned S3 URL for the category icon image.\n        - children\
        \ (list)  — Nested list of child category objects.\n        - disabled (bool)\
        \  — Disabled or not disabled if there is any subscription plan\n    401 :\
        \ ErrorResponseSerializer\n        Returned when the request lacks a valid\
        \ authentication token.\n    "
