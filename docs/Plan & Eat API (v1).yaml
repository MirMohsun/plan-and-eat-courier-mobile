  /api/customers/forgot-password/:
    post:
      operationId: forgot_password
      description: "\n    Initiate the forgot password flow for a customer account.\n\
        \n    This endpoint allows customers to request a password reset by providing\
        \ their registered email address.\n    If the email exists, a one-time password\
        \ (OTP) is generated and sent to the user's email to verify their identity\n\
        \    and proceed with password reset.\n\n    ### Request body:\n    - **email**:\
        \ The customer's registered email address. Must exist in the system.\n\n \
        \   ### Backend process:\n    1. Validate that the email exists in the system.\n\
        \    2. Retrieve the corresponding `Customer` and associated `User`.\n   \
        \ 3. Generate or retrieve the OTP associated with the user (used for password\
        \ reset verification).\n    4. Render the \"forgot password\" email template\
        \ with the OTP.\n    5. Send the OTP to the user's email using the email service.\n\
        \    6. Do **not** change the user password yet — the OTP must be verified\
        \ first.\n\n    ### Successful response:\n    - Returns basic customer information\
        \ (`email`) confirming that the forgot password request was processed.\n \
        \   - Does **not** include sensitive data like passwords or tokens.\n\n  \
        \  ### Error responses:\n    - **400 Validation Error**: If the email does\
        \ not exist or is invalid.\n    - **404 Not Found**: If the customer account\
        \ cannot be found (edge case).\n\n    ### Security notes:\n    - Rate limiting\
        \ should be applied to prevent abuse.\n    - No indication is given whether\
        \ the email exists to prevent user enumeration (if desired for production).\n\
        \    "
      summary: Customer Forgot Password
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
        required: true
      security:
      - tokenAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPassword'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotFound:
                  value:
                    type: client_error
                    errors:
                    - code: not_found
                      detail: Страница не найдена.
                      attr: null
          description: ''
  /api/customers/google-login/:
    post:
      operationId: google_oauth2_login
      description: "\n    Authenticate using Google OAuth2 authorization-code flow.\n\
        \n    The frontend obtains an authorization code from Google, then sends it\
        \ here together\n    with the exact `redirect_uri` used during that OAuth\
        \ flow. The backend exchanges the\n    code for a Google access token server-side,\
        \ verifies the user via the PSA pipeline,\n    and returns JWT tokens.\n\n\
        \    ⚠️ **Security rules:**\n    - Only pre-registered, active accounts may\
        \ sign in (no auto-registration)\n    - `redirect_uri` must match exactly\
        \ the one registered in Google Cloud Console\n\n    ### Request body:\n  \
        \  - **code**: Authorization code received from Google's OAuth redirect\n\
        \    - **redirect_uri**: The redirect URI the frontend used when initiating\
        \ the OAuth flow\n      (e.g. `http://localhost:3000/auth/callback` or `postmessage`\
        \ for popup flows)\n\n    ### Successful response:\n    - **token.access**:\
        \ Short-lived access token for API calls\n    - **token.refresh**: Long-lived\
        \ refresh token\n\n    ### Backend flow:\n    1. POST `code` + `redirect_uri`\
        \ + client credentials to `oauth2.googleapis.com/token`\n    2. Receive Google\
        \ access token\n    3. Fetch user info from Google's userinfo endpoint\n \
        \   4. Check email exists in the database and `is_active = True`\n    5. Issue\
        \ JWT tokens\n\n    ### Error responses (400):\n    - Invalid or expired code\n\
        \    - `redirect_uri` mismatch\n    - Email not registered in the system\n\
        \    - Account is inactive\n\n    ### Frontend example (React, authorization-code\
        \ flow):\n    ```javascript\n    import { useGoogleLogin } from '@react-oauth/google';\n\
        \n    const login = useGoogleLogin({\n        flow: 'auth-code',\n       \
        \ onSuccess: async ({ code }) => {\n            const res = await fetch('/api/customers/google-login/',\
        \ {\n                method: 'POST',\n                headers: { 'Content-Type':\
        \ 'application/json' },\n                body: JSON.stringify({\n        \
        \            code,\n                    redirect_uri: 'postmessage',  // popup\
        \ flow uses 'postmessage'\n                }),\n            });\n        \
        \    const { token } = await res.json();\n            localStorage.setItem('access_token',\
        \ token.access);\n            localStorage.setItem('refresh_token', token.refresh);\n\
        \        },\n    });\n    ```\n\n    ### Required environment variables:\n\
        \    - `GOOGLE_OAUTH2_CLIENT_ID`: OAuth 2.0 Client ID from Google Cloud Console\n\
        \    - `GOOGLE_OAUTH2_CLIENT_SECRET`: Client Secret from Google Cloud Console\n\
        \    "
      summary: Google OAuth2 Login
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleOAuth2'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleOAuth2'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleOAuth2'
        required: true
      security:
      - tokenAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleOAuth2'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PermissionDenied:
                  value:
                    type: client_error
                    errors:
                    - code: permission_denied
                      detail: У вас недостаточно прав для выполнения данного действия.
                      attr: null
          description: ''
