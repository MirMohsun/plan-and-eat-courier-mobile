  /api/customers/relations/generate/:
    post:
      operationId: relation_link_generate
      description: "\n    Generate a unique invitation token for linking two customer\
        \ accounts as relatives.\n\n    An authenticated customer (who does not belong\
        \ to a company) can call this endpoint\n    to get a shareable one-time token.\
        \ The token can then be used by another customer\n    to accept the relation\
        \ invitation via the `/relation/invite/<token>/` endpoint.\n\n    ### Restrictions:\n\
        \    - The requesting customer must **not** have an active company.\n    -\
        \ Each call regenerates the token, invalidating any previously issued one.\n\
        \n    ### Successful response:\n    - **token**: The newly generated invitation\
        \ token (UUID without dashes).\n\n    ### Error responses:\n    - **400 Validation\
        \ Error**: Customer already belongs to a company.\n    - **401 Unauthorized**:\
        \ Authentication token is missing or invalid.\n    "
      summary: Generate Relation Invite Link
      tags:
      - customers
      requestBody:
        content:
          application/json:
