  /api/subscriptions/:
    get:
      operationId: subscriptions
      description: "\n    OpenAPI schema decorator for SubscriptionListView.\n\n \
        \   Endpoint\n    --------\n    GET /subscriptions/\n\n    Purpose\n    -------\n\
        \    Returns the complete, **un-paginated** list of subscription plans offered\n\
        \    on the platform.  Each plan represents a curated meal-delivery package\n\
        \    that a customer can subscribe to.  The consumer typically renders these\n\
        \    as product cards on the subscription discovery / pricing screen.\n\n\
        \    Authentication\n    --------------\n    Requires a valid JWT bearer token\
        \ in the ``Authorization`` header\n    (``Bearer <token>``).  Unauthenticated\
        \ requests receive a 401 response.\n\n    Response shape — 200 OK\n    -----------------------\n\
        \    A JSON array where each element is a fully resolved subscription object:\n\
        \n    Field            Type        Description\n    ---------------  ----------\
        \  ---------------------------------------------\n    id               int\
        \         Auto-incremented primary key.\n    name             str        \
        \ Unique, human-readable plan name\n                                 (e.g.\
        \ \"Classic\", \"Premium\").\n    image            url         Presigned S3\
        \ URL for the plan's cover image.\n                                 Stored\
        \ under the ``subscriptions/`` S3 prefix.\n    price_per_meal   decimal  \
        \   Cost per individual meal within this plan\n                          \
        \       (max 10 digits, 2 decimal places).\n    price_per_month  decimal \
        \    Total monthly cost of the plan\n                                 (max\
        \ 10 digits, 2 decimal places).\n    quantity         int         Number of\
        \ meals included per month\n                                 (positive integer).\n\
        \    description      str (HTML)  Rich-text HTML description of the plan,\n\
        \                                 authored via CKEditor in Django Admin.\n\
        \    kitchens         list        Nested list of supplier/kitchen objects.\n\
        \                                 Each item: { id (int), name (str) }.\n \
        \                                References ``meals.Supplier`` via M2M.\n\
        \    categories       list        Nested list of meal-category objects.\n\
        \                                 Each item: { id (int), name (str),\n   \
        \                              icon (url) }.\n                           \
        \      References ``meals.Category`` via M2M.\n    calories         list \
        \       Nested list of calorie-range objects.\n                          \
        \       Each item: { id (int), name (str),\n                             \
        \    start (decimal), end (decimal) }.\n                                 References\
        \ ``meals.Calory`` via M2M.\n    created_at       datetime    ISO 8601 timestamp\
        \ — record creation time.\n    updated_at       datetime    ISO 8601 timestamp\
        \ — last modification time.\n\n    Design decisions\n    ----------------\n\
        \    * No pagination is applied because the number of subscription plans in\
        \ a\n      typical food-delivery product is small (< 20) and the full list\
        \ is\n      always needed to render the pricing page in a single request.\n\
        \    * The three M2M relations (kitchens, categories, calories) are expanded\n\
        \      inline so that the client never needs a second round-trip to resolve\n\
        \      reference IDs.\n    * The ``description`` field returns raw HTML produced\
        \ by CKEditor; the\n      client is responsible for safe rendering (e.g. ``dangerouslySetInnerHTML``\n\
        \      in React with a sanitiser like DOMPurify).\n\n    Responses\n    ---------\n\
        \    200 : SubscriptionReadSerializer (list)\n        Array of subscription\
        \ plan objects as described above.\n    401 : ErrorResponseSerializer\n  \
        \      Returned when the request lacks or contains an invalid auth token.\n\
        \    "
      summary: Subscription Plan List
      tags:
      - subscriptions
      security:
      - tokenAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionPlanRead'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AuthenticationFailed:
                  value:
                    type: client_error
                    errors:
                    - code: authentication_failed
                      detail: Некорректные учетные данные.
                      attr: null
                NotAuthenticated:
                  value:
                    type: client_error
                    errors:
                    - code: not_authenticated
                      detail: Учетные данные не были предоставлены.
                      attr: null
          description: ''
components:
  schemas:
    ActivationEnum:
      enum:
      - sedentary
      - lightly_active
      - very_active
      - highly_active
      type: string
      description: |-
        * `sedentary` - Sedentary
        * `lightly_active` - Lightly Active
        * `very_active` - Very Active
        * `highly_active` - Highly Active
    Banner:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 400
        image:
          type: string
          format: uri
      required:
      - id
      - image
      - title
    BlankEnum:
      enum:
      - ''
    CaloryCalculationCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        goal:
          $ref: '#/components/schemas/GoalEnum'
        activation:
          $ref: '#/components/schemas/ActivationEnum'
        gender:
          $ref: '#/components/schemas/GenderEnum'
        birthday:
          type: string
          format: date
        height:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        result:
          readOnly: true
      required:
      - activation
      - birthday
      - gender
      - goal
